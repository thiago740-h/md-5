<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Games - Cadastrar Jogo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #634a8b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #7b53bd;
            padding: 40px;
            border-radius: 12px;
            width: 420px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fffb00;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #fffb00;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid black;
            border-radius: 6px;
            background-color: #0f3460;
            color: #ffffff;
            font-size: 15px;
        }
        input::placeholder {
            color: #a3b8d9;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #fffb00;
            color: #4a2882;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: rgb(222, 224, 63);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cadastrar Jogo</h1>
        <form>
            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="Ex: GTA VI">

            <label for="genero">Gênero</label>
            <input type="text" id="genero" placeholder="Ex: Ação">

            <label for="preco">Preço</label>
            <input type="number" id="preco" placeholder="Ex: 199.90" step="0.01">

            <label for="plataforma">Plataforma</label>
            <select id="plataforma">
                <option value="">-- Selecione --</option>
                <option value="1">Playstation 5</option>
                <option value="2">XBox Series X</option>
                <option value="3">PC</option>
            </select>

            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
